name: Android standalone APK
on:
  push:
    branches: ['feat/android-standalone-apk', 'feat/android-native-canvas']
  pull_request:
    paths: ['android/**', 'internal/mobile/**', 'cmd/iotools-android/**', '.github/workflows/android.yml', 'scripts/android/**', 'internal/tui/clipboard*']
  workflow_dispatch:
permissions:
  contents: read
env:
  IOTOOLS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IOTOOLS_SHA }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Native bridge unit and desktop regression
        run: go test -race -count=1 -timeout 5m ./...
      - name: Select installed Android NDK
        run: |
          ndk=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$ndk"
          cat "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Build embedded Go libraries
        run: bash scripts/android/build-native.sh
      - name: Bundle offline terminal assets and licenses
        run: |
          bash scripts/android/prepare-assets.sh
          go run ./scripts/notices android/app/src/main/assets/THIRD_PARTY_LICENSES
      - name: Build debug-signed standalone APK
        run: gradle -p android --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Verify APK signature and permissions
        id: verify_apk
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          "$tools/aapt" dump permissions android/app/build/outputs/apk/debug/app-debug.apk
          "$tools/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/.*/libiotools.so|assets/android.md'
      - name: Detect already granted emulator acceleration
        run: |
          if test -r /dev/kvm && test -w /dev/kvm; then
            echo "Existing KVM access is available; no permissions changed"
            echo "ANDROID_EMULATOR_ACCEL=-accel on" >> "$GITHUB_ENV"
            echo "ANDROID_HW_DISABLE=false" >> "$GITHUB_ENV"
            echo "ANDROID_TEST_API=35" >> "$GITHUB_ENV"
            echo "ANDROID_TEST_TARGET=google_apis" >> "$GITHUB_ENV"
          else
            echo "No existing KVM access; keeping software emulation"
            echo "ANDROID_EMULATOR_ACCEL=-accel off" >> "$GITHUB_ENV"
            echo "ANDROID_HW_DISABLE=true" >> "$GITHUB_ENV"
            echo "ANDROID_TEST_API=29" >> "$GITHUB_ENV"
            echo "ANDROID_TEST_TARGET=default" >> "$GITHUB_ENV"
          fi
      - name: Real emulator UI, protocol, editing and lifecycle tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_TEST_API }}
          arch: x86_64
          target: ${{ env.ANDROID_TEST_TARGET }}
          profile: Nexus 5
          disable-animations: true
          disable-linux-hw-accel: ${{ env.ANDROID_HW_DISABLE }}
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -skin 480x800 -memory 1536 -gpu swiftshader_indirect ${{ env.ANDROID_EMULATOR_ACCEL }}
          emulator-boot-timeout: 1200
          script: bash scripts/android/run-emulator-tests.sh
      - name: Package built APK with verification reports
        if: ${{ always() && steps.verify_apk.outcome == 'success' }}
        run: |
          mkdir -p android-dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "android-dist/iotools-android-arm64-x86_64-$IOTOOLS_SHA-debug.apk"
          cp docs/android.md LICENSE android-dist/
          (cd android-dist && sha256sum *.apk > SHA256SUMS && ls -lh *.apk)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotools-android-${{ env.IOTOOLS_SHA }}
          path: |
            android-dist/
            android-evidence/
            android/app/build/reports/androidTests/
            android/native-*.txt
          if-no-files-found: error
          retention-days: 14
