name: Read-only iOS host diagnostics
on:
  push:
    branches: ['feat/gateway-rejection-validation']
    paths:
      - 'scripts/ci/diagnose_ios_host.py'
      - '.github/workflows/ios-host-diagnostics.yml'
permissions:
  contents: read
env:
  IOTOOLS_SHA: ${{ github.sha }}
jobs:
  diagnostics:
    runs-on: macos-15
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record fixed Xcode and simulator service observations
        run: python3 scripts/ci/diagnose_ios_host.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-host-diagnostics-${{ github.sha }}
          path: platform-evidence/ios-host-diagnostics/
          if-no-files-found: error
          retention-days: 14
