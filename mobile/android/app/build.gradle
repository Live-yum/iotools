plugins { id 'com.android.application'; id 'dev.flutter.flutter-gradle-plugin' }
android {
 namespace 'io.github.liveyum.iotools'
 buildFeatures { buildConfig true }
 testBuildType = (project.findProperty('iotoolsTestBuildType') ?: 'debug').toString()
 if (testBuildType == 'release') { sourceSets.androidTest.java.srcDir 'src/androidTestRelease/java' }
 compileSdk 36
 ndkVersion '28.1.13356709'
 defaultConfig {
  applicationId 'io.github.liveyum.iotools'
  minSdk 26
  targetSdk 35
  versionCode flutter.versionCode
  versionName flutter.versionName
  def sourceSha = System.getenv('IOTOOLS_SHA') ?: 'local'
  if (!(sourceSha ==~ /[a-zA-Z0-9._-]+/)) throw new GradleException('Invalid build revision')
  buildConfigField 'String', 'GIT_SHA', '"' + sourceSha + '"'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 buildTypes { debug { debuggable true }; release { signingConfig signingConfigs.debug; minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
 packaging { jniLibs { useLegacyPackaging = true } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
flutter { source '../..' }
dependencies {
 implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'
 // Match the debug app's Flutter integration_test runtime and instrumentation.
 // Keep Gradle's consistent resolution enabled; select one tested AndroidX stack.
 implementation 'androidx.test:runner:1.6.2'
 implementation 'androidx.test:rules:1.6.1'
 implementation 'androidx.test.ext:junit:1.2.1'
 implementation 'androidx.test.espresso:espresso-core:3.6.1' 
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:rules:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
