name: iotools_mobile
description: 共享协议内核的跨平台工业与网络调试工具
publish_to: none
version: 0.3.2+5
environment:
  sdk: ">=3.9.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  yaml: ^3.1.3
  cupertino_icons: ^1.0.8
  ffi: ^2.1.4
  file_selector: ^1.0.3
  path_provider: ^2.1.6
  # Android uses our MethodChannelPlatform, not path_provider feature calls.
  # Keep its supported Java implementation; isolate unused external Dart JNI.
  # See docs/android-dependency-isolation.md. This is not a proven crash fix.
  path_provider_android: 2.2.23
  path: ^1.9.1
  archive: ^4.0.7
  http: ^1.6.0
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - lib/core/platform/native/assets/help.md
    - lib/core/platform/native/assets/LICENSE
